<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the map — Samuel Praise Etah</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c120f">
<link rel="icon" type="image/png" href="/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=JetBrains+Mono:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0c120f; --ink: #efe9dc; --smoke: #9aa39a; --accent: #e0603f; --line: rgba(239,233,220,.14); }
  @media (prefers-color-scheme: light) { :root { --bg: #f4efe4; --ink: #14201a; --smoke: #5d665f; --accent: #b8432a; --line: rgba(20,32,26,.14); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 400 1.05rem/1.6 "Manrope", system-ui, sans-serif; padding: 1.5rem 1rem; }
  main { max-width: 34rem; text-align: center; }
  svg { width: 9rem; height: auto; margin: 0 auto 1.5rem; display: block; }
  .c { fill: none; stroke: var(--line); }
  .l { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6 8; }
  .x { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
  .code { font: 400 .72rem "JetBrains Mono", monospace; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin: 0 0 .75rem; }
  h1 { font: 400 clamp(2.4rem, 8vw, 3.6rem)/1 "Fraunces", Georgia, serif; letter-spacing: -.03em; margin: 0 0 1rem; }
  h1 em { font-style: italic; font-weight: 300; color: var(--accent); }
  p { color: var(--smoke); margin: 0 0 2rem; }
  a { display: inline-flex; align-items: center; gap: .6rem; height: 3rem; padding: 0 1.5rem; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font: 500 .74rem "JetBrains Mono", monospace; letter-spacing: .16em; text-transform: uppercase; }
  a:hover { background: var(--ink); color: var(--bg); }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 120 160" aria-hidden="true">
    <ellipse class="c" cx="60" cy="80" rx="50" ry="66"/><ellipse class="c" cx="60" cy="80" rx="34" ry="46"/>
    <path class="l" d="M60 8 C 70 40, 48 60, 58 82"/>
    <path class="x" d="M50 96 L66 112 M66 96 L50 112"/>
  </svg>
  <p class="code">Error 404</p>
  <h1 id="h">This page is <em>off the map.</em></h1>
  <p id="p">The link may be old, or the address mistyped. The line stops here, but the history doesn’t.</p>
  <a href="/" id="a">Back to the portfolio <span aria-hidden="true">→</span></a>
</main>
<script>
  (function () {
    var L = { fr: ['Cette page est <em>hors de la carte.</em>', 'Le lien est peut-être ancien, ou l’adresse mal tapée. La ligne s’arrête ici, mais pas l’histoire.', 'Retour au portfolio', 'Hors de la carte — Samuel Praise Etah'],
              de: ['Diese Seite liegt <em>außerhalb der Karte.</em>', 'Der Link ist vielleicht veraltet oder die Adresse falsch. Die Linie endet hier, die Geschichte nicht.', 'Zurück zum Portfolio', 'Außerhalb der Karte — Samuel Praise Etah'] };
    var lang = 'en';
    try { lang = localStorage.getItem('lang') || (navigator.language || 'en').slice(0, 2); } catch (e) {}
    var t = L[lang]; if (!t) return;
    document.documentElement.lang = lang;
    document.getElementById('h').innerHTML = t[0];
    document.getElementById('p').textContent = t[1];
    document.getElementById('a').firstChild.textContent = t[2] + ' ';
    document.getElementById('a').href = '/?lang=' + lang;
    document.title = t[3];
  })();
</script>
</body>
</html>
